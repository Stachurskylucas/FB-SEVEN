# ==============================================================================
# FB SEVEN TRAINING - NGINX PRODUCTION CONFIGURATION (nginx.conf)
# Módulo 1: Seguridad & Privacidad | Módulo 2: Optimización & WPO
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name fbsevengym.com www.fbsevengym.com;
    
    # 1. Redirección forzada HTTP -> HTTPS (301)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fbsevengym.com;

    # Redirección canónica www -> non-www
    return 301 https://fbsevengym.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fbsevengym.com;

    root /var/www/fb-seven-gym/dist;
    index index.html;

    # Certificados SSL (ejemplo Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/fbsevengym.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fbsevengym.com/privkey.pem;

    # Protocolos SSL seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # 2. CABECERAS DE SEGURIDAD ESTRICTAS (SECURITY HEADERS)
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://sdk.mercadopago.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; frame-src 'self' https://www.google.com https://maps.google.com https://js.stripe.com https://sdk.mercadopago.com; connect-src 'self' https://api.mercadopago.com https://api.stripe.com https://www.google.com https://wa.me; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me;" always;

    # --------------------------------------------------------------------------
    # 3. COMPRESIÓN GZIP (WPO)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 4. CONTROL DE CACHÉ DE ACTIVOS ESTÁTICOS CON HASH (WPO)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2|woff|ttf|webp|avif|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML nunca cacheado para servir siempre la SPA actualizada
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # --------------------------------------------------------------------------
    # 5. PROTECCIÓN DE ARCHIVOS OCULTOS Y SENSIBLES
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(bak|config|sql|ini|log|sh|inc|swp|env|git|json|ts|tsx)$ {
        deny all;
    }

    # Permitir explícitamente robots.txt y sitemap.xml
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 6. ENRUTAMIENTO SPA (VITE / REACT ROUTER)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
